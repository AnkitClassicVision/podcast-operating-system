[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-operating-system"
version = "0.1.0"
description = "Tool-swappable podcast production harness"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Podcast Operating System contributors"}]

[project.scripts]
podcast-os = "podcast_os.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
